version: 2
updates:
  # The base image: a new Alpine tag is a security event worth its own PR.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      docker-base:
        patterns:
          - "*"

  # Keep the pinned action SHAs moving with each release.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
